name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile bridge
        run: python -m py_compile bridge.py
      - name: Validate Community Apps repository
        run: python scripts/validate_repository.py --submission
      - name: Build container
        run: docker build --build-arg VERSION=ci --build-arg SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}" -t amcrest-ptz-bridge:ci .
